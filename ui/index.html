<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HeyBurrito</title>
    <meta http-equiv="refresh" content="0; url=/admin/login" />
  </head>
  <body>
    <p>Redirigiendo al <a href="/admin/login">panel de administración</a>…</p>
    <script>
      // Skip the login screen when there is already a session.
      try {
        window.location.replace(
          localStorage.getItem('jwt_token') ? '/admin/ui' : '/admin/login',
        );
      } catch {
        window.location.replace('/admin/login');
      }
    </script>
  </body>
</html>
