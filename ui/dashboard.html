<!doctype html>
<html lang="es" data-theme="">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Panel de administración · HeyBurrito</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f5f7;
        --surface: #ffffff;
        --surface-2: #fafbfc;
        --surface-hover: #f6f7f9;
        --border: #e3e6ea;
        --border-strong: #d3d8de;
        --text: #161d26;
        --text-muted: #667085;
        --text-faint: #98a2b3;
        --accent: #ff6b35;
        --accent-hover: #ef5a22;
        --accent-ink: #ffffff;
        --accent-soft: rgba(255, 107, 53, 0.12);
        --success: #0f7b5a;
        --success-soft: rgba(15, 123, 90, 0.12);
        --danger: #cf2f22;
        --danger-soft: rgba(207, 47, 34, 0.1);
        --shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.06);
        --shadow: 0 1px 3px rgba(16, 24, 40, 0.1),
          0 1px 2px rgba(16, 24, 40, 0.06);
        --radius: 12px;
        --radius-sm: 8px;
      }

      :root[data-theme='dark'] {
        color-scheme: dark;
        --bg: #0e1116;
        --surface: #161b22;
        --surface-2: #1c222b;
        --surface-hover: #1e242e;
        --border: #262d38;
        --border-strong: #333c49;
        --text: #e7ecf3;
        --text-muted: #98a2b3;
        --text-faint: #6b7684;
        --accent: #ff7c4d;
        --accent-hover: #ff9169;
        --accent-ink: #1a1005;
        --accent-soft: rgba(255, 124, 77, 0.16);
        --success: #3fbf90;
        --success-soft: rgba(63, 191, 144, 0.16);
        --danger: #f2776b;
        --danger-soft: rgba(242, 119, 107, 0.16);
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
        --shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          color-scheme: dark;
          --bg: #0e1116;
          --surface: #161b22;
          --surface-2: #1c222b;
          --surface-hover: #1e242e;
          --border: #262d38;
          --border-strong: #333c49;
          --text: #e7ecf3;
          --text-muted: #98a2b3;
          --text-faint: #6b7684;
          --accent: #ff7c4d;
          --accent-hover: #ff9169;
          --accent-ink: #1a1005;
          --accent-soft: rgba(255, 124, 77, 0.16);
          --success: #3fbf90;
          --success-soft: rgba(63, 191, 144, 0.16);
          --danger: #f2776b;
          --danger-soft: rgba(242, 119, 107, 0.16);
          --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
          --shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          'Helvetica Neue', Arial, sans-serif;
        font-size: 14px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      h1,
      h2,
      h3 {
        margin: 0;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      button {
        font: inherit;
        cursor: pointer;
      }

      /* ---------- App shell ---------- */
      .topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 0.75rem 1.25rem;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        font-weight: 600;
        font-size: 1rem;
        margin-right: auto;
      }

      .brand__mark {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        border-radius: 9px;
        background: var(--accent-soft);
        font-size: 1rem;
      }

      .brand__sub {
        color: var(--text-faint);
        font-weight: 400;
      }

      .topbar__meta {
        color: var(--text-faint);
        font-size: 0.8125rem;
        font-variant-numeric: tabular-nums;
      }

      @media (max-width: 720px) {
        .topbar__meta {
          display: none;
        }

        /* Keep the wordmark on one line instead of breaking before "Admin". */
        .topbar {
          gap: 0.6rem;
          padding: 0.75rem 0.85rem;
        }

        .brand__sub {
          display: none;
        }
      }

      .icon-button {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--surface);
        color: var(--text-muted);
        font-size: 0.95rem;
        transition:
          background 0.15s,
          color 0.15s,
          border-color 0.15s;
      }

      .icon-button:hover {
        background: var(--surface-hover);
        color: var(--text);
        border-color: var(--border-strong);
      }

      .icon-button[data-busy='true'] {
        opacity: 0.5;
        pointer-events: none;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.4rem;
        padding: 0.5rem 0.9rem;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--surface);
        color: var(--text);
        font-weight: 500;
        white-space: nowrap;
        transition:
          background 0.15s,
          border-color 0.15s,
          opacity 0.15s;
      }

      .button:hover:not(:disabled) {
        background: var(--surface-hover);
        border-color: var(--border-strong);
      }

      .button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .button--primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-ink);
      }

      .button--primary:hover:not(:disabled) {
        background: var(--accent-hover);
        border-color: var(--accent-hover);
      }

      .button--danger {
        color: var(--danger);
        border-color: transparent;
        background: transparent;
        padding: 0.3rem 0.55rem;
      }

      .button--danger:hover:not(:disabled) {
        background: var(--danger-soft);
        border-color: transparent;
      }

      .layout {
        display: grid;
        grid-template-columns: 216px minmax(0, 1fr);
        gap: 1.5rem;
        max-width: 1360px;
        margin: 0 auto;
        padding: 1.5rem 1.25rem 3rem;
      }

      .nav {
        display: flex;
        flex-direction: column;
        gap: 0.15rem;
        position: sticky;
        top: 74px;
        align-self: start;
      }

      .nav__item {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        padding: 0.55rem 0.7rem;
        border: 0;
        border-radius: var(--radius-sm);
        background: transparent;
        color: var(--text-muted);
        font-weight: 500;
        text-align: left;
        transition:
          background 0.15s,
          color 0.15s;
      }

      .nav__item:hover {
        background: var(--surface-hover);
        color: var(--text);
      }

      .nav__item[aria-current='page'] {
        background: var(--accent-soft);
        color: var(--accent);
      }

      .nav__count {
        margin-left: auto;
        font-size: 0.75rem;
        color: var(--text-faint);
        font-variant-numeric: tabular-nums;
      }

      @media (max-width: 860px) {
        .layout {
          grid-template-columns: minmax(0, 1fr);
          gap: 1rem;
          padding: 1rem 0.85rem 2.5rem;
        }

        .nav {
          position: static;
          flex-direction: row;
          gap: 0.35rem;
          overflow-x: auto;
          padding-bottom: 0.35rem;
          scrollbar-width: none;
        }

        .nav::-webkit-scrollbar {
          display: none;
        }

        .nav__item {
          white-space: nowrap;
          border: 1px solid var(--border);
          background: var(--surface);
        }

        .nav__count {
          display: none;
        }
      }

      /* ---------- Panels ---------- */
      .panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow-sm);
        overflow: hidden;
      }

      .panel__head {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        flex-wrap: wrap;
        padding: 0.9rem 1.1rem;
        border-bottom: 1px solid var(--border);
      }

      .panel__title {
        font-size: 0.9375rem;
      }

      .panel__hint {
        color: var(--text-faint);
        font-size: 0.8125rem;
      }

      .panel__actions {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        flex-wrap: wrap;
      }

      .panel__body {
        padding: 1.1rem;
      }

      .section {
        display: grid;
        gap: 1.25rem;
      }

      .section__title {
        font-size: 1.35rem;
      }

      .section__lede {
        color: var(--text-muted);
        margin: 0.2rem 0 0;
      }

      /* ---------- Stats ---------- */
      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(168px, 1fr));
        gap: 0.9rem;
      }

      .stat {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow-sm);
        padding: 1rem 1.1rem;
      }

      .stat__label {
        color: var(--text-muted);
        font-size: 0.8125rem;
        font-weight: 500;
      }

      .stat__value {
        font-size: 1.9rem;
        font-weight: 650;
        line-height: 1.15;
        margin-top: 0.35rem;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.02em;
      }

      .stat__hint {
        color: var(--text-faint);
        font-size: 0.75rem;
        margin-top: 0.15rem;
      }

      /* ---------- Chart ---------- */
      .chart {
        width: 100%;
        height: 168px;
        display: block;
        overflow: visible;
      }

      .chart__bar {
        fill: var(--accent);
        opacity: 0.85;
        transition: opacity 0.15s;
      }

      .chart__bar:hover {
        opacity: 1;
      }

      .chart__bar--empty {
        fill: var(--border);
        opacity: 1;
      }

      .chart__axis {
        display: flex;
        justify-content: space-between;
        color: var(--text-faint);
        font-size: 0.75rem;
        margin-top: 0.5rem;
        font-variant-numeric: tabular-nums;
      }

      /* ---------- Tables ---------- */
      .table-wrap {
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-variant-numeric: tabular-nums;
      }

      th,
      td {
        padding: 0.7rem 1.1rem;
        text-align: left;
        border-bottom: 1px solid var(--border);
        white-space: nowrap;
      }

      th {
        background: var(--surface-2);
        color: var(--text-muted);
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        position: sticky;
        top: 0;
      }

      tbody tr:last-child td {
        border-bottom: 0;
      }

      tbody tr:hover td {
        background: var(--surface-hover);
      }

      .num {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      .wrap-text {
        white-space: normal;
        min-width: 220px;
        color: var(--text-muted);
      }

      .rank {
        display: grid;
        place-items: center;
        width: 24px;
        height: 24px;
        border-radius: 7px;
        background: var(--surface-2);
        border: 1px solid var(--border);
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--text-muted);
      }

      .rank--1 {
        background: var(--accent-soft);
        border-color: transparent;
        color: var(--accent);
      }

      .user {
        display: inline-flex;
        align-items: center;
        gap: 0.55rem;
        font-weight: 500;
      }

      .avatar {
        display: grid;
        place-items: center;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 0.7rem;
        font-weight: 650;
        flex: none;
      }

      .meter {
        display: block;
        height: 5px;
        border-radius: 99px;
        background: var(--accent);
        opacity: 0.8;
        margin-top: 0.3rem;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
        padding: 0.12rem 0.5rem;
        border-radius: 99px;
        font-size: 0.75rem;
        font-weight: 550;
        background: var(--surface-2);
        border: 1px solid var(--border);
        color: var(--text-muted);
      }

      .badge--today {
        background: var(--accent-soft);
        border-color: transparent;
        color: var(--accent);
      }

      .badge--soon {
        background: var(--success-soft);
        border-color: transparent;
        color: var(--success);
      }

      .mono {
        font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, monospace;
        font-size: 0.8125rem;
      }

      /* ---------- Forms ---------- */
      .field {
        display: grid;
        gap: 0.3rem;
      }

      .field__label {
        font-size: 0.8125rem;
        font-weight: 550;
        color: var(--text-muted);
      }

      .field__hint {
        font-size: 0.75rem;
        color: var(--text-faint);
      }

      input[type='text'],
      input[type='password'],
      input[type='search'] {
        width: 100%;
        padding: 0.5rem 0.7rem;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-sm);
        background: var(--surface);
        color: var(--text);
        font: inherit;
      }

      input:focus-visible,
      button:focus-visible,
      select:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }

      input::placeholder {
        color: var(--text-faint);
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 0.9rem;
        align-items: end;
      }

      /* Needs `input.search` to outrank the `input[type='search']` rule above;
         a percentage width inside the wrapping action row breaks the header
         onto two lines. */
      input.search {
        width: 220px;
        flex: 0 0 auto;
      }

      /* ---------- States ---------- */
      .empty {
        padding: 2.5rem 1.1rem;
        text-align: center;
        color: var(--text-muted);
      }

      .empty__icon {
        font-size: 1.6rem;
        display: block;
        margin-bottom: 0.4rem;
      }

      .skeleton {
        border-radius: var(--radius-sm);
        background: linear-gradient(
          90deg,
          var(--surface-2) 25%,
          var(--surface-hover) 37%,
          var(--surface-2) 63%
        );
        background-size: 400% 100%;
        animation: shimmer 1.3s ease-in-out infinite;
      }

      @keyframes shimmer {
        0% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0 50%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .skeleton {
          animation: none;
        }
      }

      .banner {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        padding: 0.75rem 1rem;
        border-radius: var(--radius);
        border: 1px solid transparent;
        font-weight: 500;
      }

      .banner--error {
        background: var(--danger-soft);
        color: var(--danger);
      }

      .banner--party {
        background: var(--accent-soft);
        color: var(--accent);
      }

      .toasts {
        position: fixed;
        right: 1rem;
        bottom: 1rem;
        z-index: 50;
        display: grid;
        gap: 0.5rem;
        max-width: min(360px, calc(100vw - 2rem));
      }

      .toast {
        padding: 0.7rem 0.9rem;
        border-radius: var(--radius-sm);
        background: var(--surface);
        border: 1px solid var(--border);
        border-left: 3px solid var(--text-muted);
        box-shadow: var(--shadow);
        font-weight: 500;
        animation: slide-in 0.18s ease-out;
      }

      .toast--success {
        border-left-color: var(--success);
      }

      .toast--error {
        border-left-color: var(--danger);
      }

      @keyframes slide-in {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .toast {
          animation: none;
        }
      }

      .pager {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.75rem 1.1rem;
        border-top: 1px solid var(--border);
        color: var(--text-muted);
        font-size: 0.8125rem;
      }

      .pager__spacer {
        margin-left: auto;
      }

      .grid-2 {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 1.25rem;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand__mark" aria-hidden="true">🌯</span>
        <span>HeyBurrito <span class="brand__sub">· Admin</span></span>
      </div>
      <span class="topbar__meta" id="lastUpdated"></span>
      <button
        class="icon-button"
        id="refreshButton"
        type="button"
        title="Actualizar datos"
        aria-label="Actualizar datos"
      >
        ↻
      </button>
      <button
        class="icon-button"
        id="themeButton"
        type="button"
        title="Cambiar tema"
        aria-label="Cambiar tema"
      >
        ◐
      </button>
      <button class="button" id="logoutButton" type="button">Salir</button>
    </header>

    <div class="layout">
      <nav class="nav" id="nav" aria-label="Secciones del panel"></nav>
      <main id="view" tabindex="-1"></main>
    </div>

    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

    <script type="module" src="/src/dashboard.js"></script>
  </body>
</html>
